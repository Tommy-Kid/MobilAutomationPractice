# Ez a fájl váltja ki a régi config.yaml-t és az összes config osztályt.
# Minden "appium." kezdetű kulcsot a Serenity capabilityként küld az Appium szervernek.

serenity {
  project.name = "WDIO Native Demo App"
  take.screenshots = FOR_FAILURES
}

webdriver {
  driver = appium
  wait.for.timeout = 10000
}

appium {
  hub = "http://127.0.0.1:4723"
  platformName = Android
  automationName = UiAutomator2
  # "classpath:" = a src/test/resources mappához képest
  app = "classpath:app/android.wdio.native.app.v2.2.0.apk"
  noReset = true
  newCommandTimeout = 300
}

# Eszközválasztás futtatáskor:  mvn clean verify "-Denvironment=pixel10ProFold"
# Ha nincs megadva, a "default" blokk érvényes.
environments {
  default {
    appium.udid = "emulator-5554"
  }
  pixel9Pro {
    appium.udid = "emulator-5554"
    appium.systemPort = 8200
    # appium.avd = "Pixel_9_Pro"        # ha ezt bekapcsolod, az Appium maga indítja az emulátort
  }
  pixel10ProFold {
    appium.udid = "emulator-5556"
    appium.systemPort = 8201
    # appium.avd = "Pixel_10_Pro_Fold"
  }
}
