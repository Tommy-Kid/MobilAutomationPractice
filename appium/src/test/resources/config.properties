# ---------- Appium szerver ----------
server.host=127.0.0.1
server.port=4723

# ---------- Alap capabilityk (minden eszközre) ----------
appium.platformName=Android
appium.platform.version=13.0
appium.automationName=UiAutomator2
# Classpath-relatív útvonal (target/test-classes alatt) - a DriverFactory a classloaderrel
# oldja fel abszolút útra, így független attól, honnan (gyökér/modul) hívod a mvn-t.
appium.app=app/android.wdio.native.app.v2.2.0.apk
appium.noReset=true
appium.newCommandTimeout=300
appium.autoGrantPermissions=true

# ---------- Eszközök ----------
# Egy konkrét eszközre rögzítve futtatod:  mvn verify -Ddevice=pixel10ProFold (minden szál ezt kapja)
# -Ddevice nélkül: a pool-ban felsorolt eszközök körforgásban (round-robin), szálanként kiosztva
# (DevicePool). A parallelism ne legyen nagyobb, mint a pool mérete.
device.pool=pixel9Pro,pixel10ProFold

device.pixel9Pro.udid=emulator-5554
device.pixel9Pro.systemPort=8200
device.name.pixel9Pro=Pixel_9_Pro

device.pixel10ProFold.udid=emulator-5556
device.pixel10ProFold.systemPort=8201
device.name.pixel10ProFold=Pixel_10_Pro_Fold

# ---------- Keretrendszer beállítások (nem capabilityk) ----------
timeout.explicit.seconds=10
screenshot.onFailure=true