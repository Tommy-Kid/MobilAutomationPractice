# ---------- Appium szerver ----------
server.host=127.0.0.1
server.port=4723

# ---------- Alap capabilityk (minden eszkozre) ----------
appium.platformName=Android
appium.automationName=UiAutomator2
appium.app=app/android.wdio.native.app.v2.2.0.apk
appium.ios.app=app/ios.simulator.wdio.native.app.v2.2.0.zip
appium.noReset=true
appium.newCommandTimeout=300
appium.autoGrantPermissions=true

# ---------- Eszkozok ----------
# Az eszkozt az Appium device-farm plugin foglalja: a kert platform (es opcionalisan udid) alapjan
# valaszt egy szabad eszkozt, es driver.quit()-nel felszabaditja. Ha nincs szabad, a session keres var / hibazik.
#   mvn verify -Dplatform=android|ios      (alapert.: appium.platformName)
#   mvn verify -Dudid=emulator-5554        (konkret eszkoz rogzitese, opcionalis)

# ---------- Keretrendszer beallitasok (nem capabilityk) ----------
timeout.explicit.seconds=10
screenshot.onFailure=true