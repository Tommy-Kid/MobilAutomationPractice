# Parallel futtatás JUnit5 alatt. A parallelism értéke a config.properties device.pool
# mezőjében felsorolt eszközök számával egyezzen meg (most 2: pixel9Pro, pixel10ProFold),
# mert a DevicePool ennyi eszközt tud szálanként szétosztani.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 2

